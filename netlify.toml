[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--force"

# Subdomain redirects for courses
[[redirects]]
  from = "https://fun.neeldhara.com/*"
  to = "https://neeldhara.com/fun/:splat"
  status = 301
  force = true

