[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--force"

# Asset redirects for subdomains - these must come first
[[redirects]]
  from = "https://*.neeldhara.courses/_astro/*"
  to = "/_astro/:splat"
  status = 200

[[redirects]]
  from = "https://*.neeldhara.courses/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "https://*.neeldhara.courses/images/*"
  to = "/images/:splat"
  status = 200

[[redirects]]
  from = "https://*.neeldhara.courses/favicons/*"
  to = "/favicons/:splat"
  status = 200

[[redirects]]
  from = "https://*.neeldhara.courses/pagefind/*"
  to = "/pagefind/:splat"
  status = 200

[[redirects]]
  from = "https://*.neeldhara.courses/*.css"
  to = "/:splat.css"
  status = 200

[[redirects]]
  from = "https://*.neeldhara.courses/*.js"
  to = "/:splat.js"
  status = 200

[[redirects]]
  from = "https://*.neeldhara.courses/*.json"
  to = "/:splat.json"
  status = 200

# Course root redirects - redirect to first available tab
[[redirects]]
  from = "/mas/"
  to = "/mas/notes/"
  status = 302

[[redirects]]
  from = "/fun/"
  to = "/fun/notes/"
  status = 302

[[redirects]]
  from = "/mfai/"
  to = "/mfai/notes/"
  status = 302

[[redirects]]
  from = "/dm/"
  to = "/dm/notes/"
  status = 302

[[redirects]]
  from = "/dsa/"
  to = "/dsa/notes/"
  status = 302

[[redirects]]
  from = "/fpt/"
  to = "/fpt/notes/"
  status = 302

[[redirects]]
  from = "/cp/"
  to = "/cp/notes/"
  status = 302

[[redirects]]
  from = "/magic/"
  to = "/magic/notes/"
  status = 302

[[redirects]]
  from = "/advalgo/"
  to = "/advalgo/notes/"
  status = 302

[[redirects]]
  from = "/combinatorics/"
  to = "/combinatorics/notes/"
  status = 302

[[redirects]]
  from = "/linalg/"
  to = "/linalg/notes/"
  status = 302

[[redirects]]
  from = "/comsoc/"
  to = "/comsoc/notes/"
  status = 302

[[redirects]]
  from = "/misc/"
  to = "/misc/notes/"
  status = 302

# Subdomain redirects for courses
[[redirects]]
  from = "https://fun.neeldhara.courses/*"
  to = "/fun/:splat"
  status = 200

[[redirects]]
  from = "https://mas.neeldhara.courses/*"
  to = "/mas/:splat"
  status = 200

[[redirects]]
  from = "https://mfai.neeldhara.courses/*"
  to = "/mfai/:splat"
  status = 200

[[redirects]]
  from = "https://dm.neeldhara.courses/*"
  to = "/dm/:splat"
  status = 200

[[redirects]]
  from = "https://dsa.neeldhara.courses/*"
  to = "/dsa/:splat"
  status = 200

[[redirects]]
  from = "https://fpt.neeldhara.courses/*"
  to = "/fpt/:splat"
  status = 200

[[redirects]]
  from = "https://cp.neeldhara.courses/*"
  to = "/cp/:splat"
  status = 200

[[redirects]]
  from = "https://magic.neeldhara.courses/*"
  to = "/magic/:splat"
  status = 200

[[redirects]]
  from = "https://advalgo.neeldhara.courses/*"
  to = "/advalgo/:splat"
  status = 200

[[redirects]]
  from = "https://combinatorics.neeldhara.courses/*"
  to = "/combinatorics/:splat"
  status = 200

[[redirects]]
  from = "https://linalg.neeldhara.courses/*"
  to = "/linalg/:splat"
  status = 200

[[redirects]]
  from = "https://comsoc.neeldhara.courses/*"
  to = "/comsoc/:splat"
  status = 200

[[redirects]]
  from = "https://misc.neeldhara.courses/*"
  to = "/misc/:splat"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
 for = "/*.woff2"
 [headers.values]
   Cache-Control = "public, max-age=31536000, immutable"


[dev]
 command = "npm run dev"
 port = 4321
 targetPort = 4321
 autoLaunch = false
