[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--force"

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
 for = "/*.woff2"
 [headers.values]
   Cache-Control = "public, max-age=31536000, immutable"

# Subdomain redirects for ID.neeldhara.courses
[[redirects]]
 from = "https://:course.neeldhara.courses/*"
 to = "/:course/:splat"
 status = 200

[dev]
 command = "npm run dev"
 port = 4321
 targetPort = 4321
 autoLaunch = false
