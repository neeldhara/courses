[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--force"

# Subdomain redirects for courses
[[redirects]]
  from = "https://fun.neeldhara.courses/*"
  to = "https://neeldhara.courses/fun/:splat"
  status = 200
  force = true

